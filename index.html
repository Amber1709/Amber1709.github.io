<!doctype html>
<html lang="nl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quest Solutions Mediations | Mediation Nederland</title>
    <meta
      name="description"
      content="Quest Solutions Mediations biedt professionele mediation in Nederland voor zakelijke, arbeids- en familiekwesties."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                500: '#4d8278',
                300: '#99b5ab',
                100: '#f4f8f6',
                sand: '#ddd1be',
              },
            },
            boxShadow: {
              soft: '0 12px 35px -20px rgba(15, 23, 42, 0.45)',
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-brand-100 text-brand-800 antialiased">
    <header class="sticky top-0 z-50 border-b border-brand-300/50 bg-brand-100/95 backdrop-blur">
      <nav class="mx-auto flex w-full max-w-7xl items-center justify-between gap-4 px-4 py-3 sm:px-6 lg:px-8" aria-label="Hoofdnavigatie">
        <a href="#hero" id="brand" class="text-base font-bold tracking-wide text-brand-900 sm:text-lg"></a>

        <button
          id="menuButton"
          class="rounded-lg border border-brand-300 p-2 text-brand-900 transition hover:bg-brand-300/20 focus:outline-none focus:ring-2 focus:ring-brand-500 md:hidden"
          aria-expanded="false"
          aria-controls="mobileMenu"
          aria-label="Open navigatiemenu"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <div class="hidden items-center gap-3 md:flex">
          <div id="navLinks" class="flex items-center gap-1"></div>
          <button
            id="langToggleDesktop"
            class="rounded-full border border-brand-300 px-3 py-2 text-xs font-semibold uppercase tracking-wide text-brand-900 transition hover:border-brand-500 hover:text-brand-500"
            type="button"
          ></button>
          <a
            href="#contact"
            id="navCta"
            class="rounded-full bg-brand-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-700"
          ></a>
        </div>
      </nav>

      <div id="mobileMenu" class="mx-auto hidden w-full max-w-7xl px-4 pb-4 sm:px-6 lg:px-8 md:hidden">
        <div id="mobileNavLinks" class="flex flex-col gap-1"></div>
        <div class="mt-3 flex items-center gap-2">
          <button
            id="langToggleMobile"
            class="rounded-full border border-brand-300 px-3 py-2 text-xs font-semibold uppercase tracking-wide text-brand-900 transition hover:border-brand-500 hover:text-brand-500"
            type="button"
          ></button>
          <a
            href="#contact"
            id="mobileNavCta"
            class="w-full rounded-full bg-brand-900 px-4 py-2 text-center text-sm font-semibold text-white transition hover:bg-brand-700"
          ></a>
        </div>
      </div>
    </header>

    <main>
      <section id="hero" class="relative overflow-hidden">
        <div class="mx-auto grid w-full max-w-7xl gap-10 px-4 py-20 sm:px-6 lg:grid-cols-2 lg:items-center lg:px-8 lg:py-24">
          <div>
            <p id="heroBadge" class="mb-4 inline-flex rounded-full bg-brand-300/30 px-4 py-1 text-xs font-semibold uppercase tracking-wide text-brand-700"></p>
            <h1 id="heroTitle" class="text-3xl font-extrabold leading-tight text-brand-900 sm:text-4xl lg:text-5xl"></h1>
            <p id="heroText" class="mt-5 max-w-xl text-base leading-relaxed text-brand-700 sm:text-lg"></p>
            <div class="mt-8 flex flex-col gap-3 sm:flex-row">
              <a
                href="#contact"
                id="heroPrimaryCta"
                class="rounded-full bg-brand-900 px-6 py-3 text-center text-sm font-semibold text-white shadow-soft transition hover:bg-brand-700"
              ></a>
              <a
                href="#services"
                id="heroSecondaryCta"
                class="rounded-full border border-brand-300 bg-white px-6 py-3 text-center text-sm font-semibold text-brand-800 transition hover:border-brand-500 hover:text-brand-500"
              ></a>
            </div>
          </div>
          <div class="rounded-3xl border border-brand-300/60 bg-white p-8 shadow-soft">
            <h2 id="heroCardTitle" class="text-xl font-bold text-brand-900"></h2>
            <p id="heroCardText" class="mt-4 text-sm leading-relaxed text-brand-700"></p>
            <ul id="heroHighlights" class="mt-6 space-y-3"></ul>
          </div>
        </div>
      </section>

      <section id="about" class="border-y border-brand-300/40 bg-white">
        <div class="mx-auto w-full max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
          <h2 id="aboutTitle" class="text-2xl font-bold text-brand-900 sm:text-3xl"></h2>
          <p id="aboutText" class="mt-4 max-w-3xl text-base leading-relaxed text-brand-700 sm:text-lg"></p>
        </div>
      </section>

      <section id="services" class="mx-auto w-full max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
        <div class="mb-10 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h2 id="servicesTitle" class="text-2xl font-bold text-brand-900 sm:text-3xl"></h2>
            <p id="servicesText" class="mt-2 max-w-2xl text-base text-brand-700"></p>
          </div>
        </div>
        <div id="servicesGrid" class="grid gap-5 md:grid-cols-2 xl:grid-cols-3"></div>
      </section>

      <section id="contact" class="bg-brand-900 text-white">
        <div class="mx-auto grid w-full max-w-7xl gap-10 px-4 py-16 sm:px-6 lg:grid-cols-2 lg:px-8">
          <div>
            <h2 id="contactTitle" class="text-2xl font-bold sm:text-3xl"></h2>
            <p id="contactText" class="mt-4 text-base leading-relaxed text-slate-200"></p>
            <div class="mt-8 space-y-3 text-sm text-slate-200">
              <p><span class="font-semibold text-white" id="contactLocationLabel"></span> <span id="contactLocation"></span></p>
              <p><span class="font-semibold text-white" id="contactEmailLabel"></span> <a id="contactEmail" class="underline decoration-brand-sand/70 underline-offset-4 hover:text-brand-sand"></a></p>
              <p><span class="font-semibold text-white" id="contactPhoneLabel"></span> <a id="contactPhone" class="underline decoration-brand-sand/70 underline-offset-4 hover:text-brand-sand"></a></p>
            </div>
          </div>

          <form class="rounded-2xl bg-white/10 p-6 backdrop-blur-sm" id="contactForm">
            <div class="grid gap-4">
              <div>
                <label for="name" id="formNameLabel" class="mb-2 block text-sm font-medium"></label>
                <input id="name" name="name" type="text" required class="w-full rounded-xl border border-white/20 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-slate-300 focus:border-brand-sand focus:outline-none focus:ring-2 focus:ring-brand-sand/30" />
              </div>
              <div>
                <label for="email" id="formEmailLabel" class="mb-2 block text-sm font-medium"></label>
                <input id="email" name="email" type="email" required class="w-full rounded-xl border border-white/20 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-slate-300 focus:border-brand-sand focus:outline-none focus:ring-2 focus:ring-brand-sand/30" />
              </div>
              <div>
                <label for="message" id="formMessageLabel" class="mb-2 block text-sm font-medium"></label>
                <textarea id="message" name="message" rows="4" required class="w-full rounded-xl border border-white/20 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-slate-300 focus:border-brand-sand focus:outline-none focus:ring-2 focus:ring-brand-sand/30"></textarea>
              </div>
              <button type="submit" id="formSubmit" class="mt-1 rounded-full bg-brand-sand px-6 py-3 text-sm font-semibold text-brand-900 transition hover:brightness-95"></button>
              <p id="formNotice" class="text-xs text-slate-200"></p>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="border-t border-brand-300/50 bg-brand-100">
      <div class="mx-auto flex w-full max-w-7xl flex-col gap-5 px-4 py-6 text-sm text-brand-700 sm:px-6 sm:flex-row sm:items-center sm:justify-between lg:px-8">
        <p id="footerCopy"></p>
        <div class="flex items-center gap-4">
          <a id="footerPrivacy" href="#" class="transition hover:text-brand-500"></a>
          <a id="footerTerms" href="#" class="transition hover:text-brand-500"></a>
        </div>
        <div class="flex items-center gap-3 text-brand-800" aria-label="Social media">
          <a href="#" class="rounded-full p-2 transition hover:bg-brand-300/20" aria-label="LinkedIn">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 11.02 5 2.5 2.5 0 01-.02-5zM3 9h4v12H3zM9 9h3.8v1.7h.1c.5-.9 1.8-1.9 3.7-1.9 4 0 4.7 2.5 4.7 5.8V21h-4v-5.5c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V21H9z"/></svg>
          </a>
          <a href="#" class="rounded-full p-2 transition hover:bg-brand-300/20" aria-label="Facebook">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 9H16V6h-2.5C10.5 6 9 7.8 9 10.7V13H7v3h2v5h3v-5h2.6l.4-3H12v-2.1c0-1 .3-1.9 1.5-1.9z"/></svg>
          </a>
          <a href="#" class="rounded-full p-2 transition hover:bg-brand-300/20" aria-label="Instagram">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a5 5 0 015 5v10a5 5 0 01-5 5H7a5 5 0 01-5-5V7a5 5 0 015-5zm10 2H7a3 3 0 00-3 3v10a3 3 0 003 3h10a3 3 0 003-3V7a3 3 0 00-3-3zm-5 3.5A5.5 5.5 0 1116.5 13 5.5 5.5 0 0112 7.5zm0 2A3.5 3.5 0 1015.5 13 3.5 3.5 0 0012 9.5zM17.8 6.2a1 1 0 11-1 1 1 1 0 011-1z"/></svg>
          </a>
        </div>
      </div>
    </footer>

    <script>
      const siteContent = {
        nl: {
          brand: 'Quest Solutions Mediations',
          nav: {
            links: [
              { label: 'Home', href: '#hero' },
              { label: 'Over Ons', href: '#about' },
              { label: 'Diensten', href: '#services' },
              { label: 'Contact', href: '#contact' },
            ],
            cta: 'Boek een Consult',
            langButton: 'EN',
          },
          hero: {
            badge: 'Mediation in Nederland',
            title: 'Rust en richting bij complexe conflicten.',
            text: 'Wij begeleiden organisaties, teams en families naar duurzame afspraken met een neutrale en mensgerichte aanpak.',
            primaryCta: 'Plan een vrijblijvend gesprek',
            secondaryCta: 'Bekijk onze diensten',
            cardTitle: 'Waarom cliënten voor ons kiezen',
            cardText: 'Onze mediators combineren juridische kennis, zakelijke scherpte en empathische communicatie voor oplossingen die blijven werken.',
            highlights: ['Gecertificeerde professionals', 'Vertrouwelijk en onafhankelijk', 'Heldere stappen met meetbare voortgang'],
          },
          about: {
            title: 'Onze filosofie',
            text: 'Quest Solutions Mediations gelooft dat elk conflict een kans is om betere samenwerking te creëren. Vanuit neutraliteit en respect begeleiden wij trajecten voor arbeidszaken, zakelijke geschillen en familievraagstukken. We sturen op oplossingen die praktisch uitvoerbaar zijn en toekomstbestendig blijven.',
          },
          services: {
            title: 'Onze mediationdiensten',
            text: 'Selecteer de begeleiding die past bij uw situatie. Elk traject wordt op maat ingericht.',
            cards: [
              {
                title: 'Arbeidsmediation',
                description: 'Voorkom escalatie bij werkconflicten en herstel werkrelaties met duidelijke, haalbare afspraken.',
              },
              {
                title: 'Zakelijke Mediation',
                description: 'Los commerciële en bestuurlijke geschillen efficiënt op met focus op continuïteit en reputatie.',
              },
              {
                title: 'Familie & Scheiding',
                description: 'Creëer evenwichtige afspraken rond scheiding, ouderschap en familievermogen in een veilige setting.',
              },
            ],
          },
          contact: {
            title: 'Neem contact op',
            text: 'Bespreek uw situatie vertrouwelijk met een mediator. Wij reageren doorgaans binnen één werkdag.',
            locationLabel: 'Locatie:',
            location: 'Nederland',
            emailLabel: 'E-mail:',
            email: 'info@questsolutionsmediations.nl',
            phoneLabel: 'Telefoon:',
            phone: '+31 (0)20 000 0000',
            form: {
              nameLabel: 'Naam',
              emailLabel: 'E-mail',
              messageLabel: 'Bericht',
              submit: 'Verstuur aanvraag',
              notice: 'Dit formulier is een demo voor GitHub Pages en verzendt nog geen gegevens.',
            },
          },
          footer: {
            copy: `© ${new Date().getFullYear()} Quest Solutions Mediations. Alle rechten voorbehouden.`,
            privacy: 'Privacyverklaring',
            terms: 'Algemene voorwaarden',
          },
          alerts: {
            formSubmitted: 'Bedankt! Dit is een demonstratiesite; er is geen bericht verzonden.',
          },
        },
        en: {
          brand: 'Quest Solutions Mediations',
          nav: {
            links: [
              { label: 'Home', href: '#hero' },
              { label: 'About', href: '#about' },
              { label: 'Services', href: '#services' },
              { label: 'Contact', href: '#contact' },
            ],
            cta: 'Book a Consultation',
            langButton: 'NL',
          },
          hero: {
            badge: 'Mediation in the Netherlands',
            title: 'Clarity and momentum for complex conflicts.',
            text: 'We support organizations, teams, and families with neutral, professional mediation focused on sustainable outcomes.',
            primaryCta: 'Plan a free intake',
            secondaryCta: 'Explore our services',
            cardTitle: 'Why clients choose us',
            cardText: 'Our mediators combine legal insight, business experience, and empathetic communication to create lasting agreements.',
            highlights: ['Certified mediation specialists', 'Confidential and impartial', 'Structured process with clear progress'],
          },
          about: {
            title: 'Our philosophy',
            text: 'Quest Solutions Mediations sees every conflict as an opportunity to rebuild trust and cooperation. We lead mediation for employment, commercial, and family matters with neutrality, respect, and practical direction. Our agreements are designed to work in real life and stay effective over time.',
          },
          services: {
            title: 'Our mediation services',
            text: 'Choose support that fits your context. Every trajectory is tailored to your needs.',
            cards: [
              {
                title: 'Employment Mediation',
                description: 'Prevent escalation in workplace disputes and restore healthy collaboration through concrete agreements.',
              },
              {
                title: 'Business Mediation',
                description: 'Resolve commercial and governance conflicts efficiently while protecting continuity and reputation.',
              },
              {
                title: 'Family & Divorce Mediation',
                description: 'Build balanced agreements around separation, co-parenting, and family assets in a safe environment.',
              },
            ],
          },
          contact: {
            title: 'Get in touch',
            text: 'Discuss your situation confidentially with a mediator. We usually respond within one business day.',
            locationLabel: 'Location:',
            location: 'Netherlands',
            emailLabel: 'Email:',
            email: 'info@questsolutionsmediations.nl',
            phoneLabel: 'Phone:',
            phone: '+31 (0)20 000 0000',
            form: {
              nameLabel: 'Name',
              emailLabel: 'Email',
              messageLabel: 'Message',
              submit: 'Send request',
              notice: 'This form is a GitHub Pages demo and does not send data yet.',
            },
          },
          footer: {
            copy: `© ${new Date().getFullYear()} Quest Solutions Mediations. All rights reserved.`,
            privacy: 'Privacy policy',
            terms: 'Terms & conditions',
          },
          alerts: {
            formSubmitted: 'Thank you! This is a demo site, so no message was sent.',
          },
        },
      };

      let currentLang = 'nl';

      const elements = {
        brand: document.getElementById('brand'),
        navLinks: document.getElementById('navLinks'),
        mobileNavLinks: document.getElementById('mobileNavLinks'),
        navCta: document.getElementById('navCta'),
        mobileNavCta: document.getElementById('mobileNavCta'),
        langToggleDesktop: document.getElementById('langToggleDesktop'),
        langToggleMobile: document.getElementById('langToggleMobile'),
        heroBadge: document.getElementById('heroBadge'),
        heroTitle: document.getElementById('heroTitle'),
        heroText: document.getElementById('heroText'),
        heroPrimaryCta: document.getElementById('heroPrimaryCta'),
        heroSecondaryCta: document.getElementById('heroSecondaryCta'),
        heroCardTitle: document.getElementById('heroCardTitle'),
        heroCardText: document.getElementById('heroCardText'),
        heroHighlights: document.getElementById('heroHighlights'),
        aboutTitle: document.getElementById('aboutTitle'),
        aboutText: document.getElementById('aboutText'),
        servicesTitle: document.getElementById('servicesTitle'),
        servicesText: document.getElementById('servicesText'),
        servicesGrid: document.getElementById('servicesGrid'),
        contactTitle: document.getElementById('contactTitle'),
        contactText: document.getElementById('contactText'),
        contactLocationLabel: document.getElementById('contactLocationLabel'),
        contactLocation: document.getElementById('contactLocation'),
        contactEmailLabel: document.getElementById('contactEmailLabel'),
        contactEmail: document.getElementById('contactEmail'),
        contactPhoneLabel: document.getElementById('contactPhoneLabel'),
        contactPhone: document.getElementById('contactPhone'),
        formNameLabel: document.getElementById('formNameLabel'),
        formEmailLabel: document.getElementById('formEmailLabel'),
        formMessageLabel: document.getElementById('formMessageLabel'),
        formSubmit: document.getElementById('formSubmit'),
        formNotice: document.getElementById('formNotice'),
        footerCopy: document.getElementById('footerCopy'),
        footerPrivacy: document.getElementById('footerPrivacy'),
        footerTerms: document.getElementById('footerTerms'),
      };

      function renderNavLinks(links, container, mobile = false) {
        container.innerHTML = links
          .map(
            (link) =>
              `<a href="${link.href}" class="rounded-lg px-3 py-2 text-sm font-medium text-brand-800 transition hover:bg-brand-300/20 hover:text-brand-900 ${mobile ? '' : ''}">${link.label}</a>`
          )
          .join('');
      }

      function renderPage(lang) {
        const copy = siteContent[lang];
        document.documentElement.lang = lang;

        elements.brand.textContent = copy.brand;
        renderNavLinks(copy.nav.links, elements.navLinks);
        renderNavLinks(copy.nav.links, elements.mobileNavLinks, true);
        elements.navCta.textContent = copy.nav.cta;
        elements.mobileNavCta.textContent = copy.nav.cta;
        elements.langToggleDesktop.textContent = copy.nav.langButton;
        elements.langToggleMobile.textContent = copy.nav.langButton;

        elements.heroBadge.textContent = copy.hero.badge;
        elements.heroTitle.textContent = copy.hero.title;
        elements.heroText.textContent = copy.hero.text;
        elements.heroPrimaryCta.textContent = copy.hero.primaryCta;
        elements.heroSecondaryCta.textContent = copy.hero.secondaryCta;
        elements.heroCardTitle.textContent = copy.hero.cardTitle;
        elements.heroCardText.textContent = copy.hero.cardText;
        elements.heroHighlights.innerHTML = copy.hero.highlights
          .map(
            (item) =>
              `<li class="flex items-start gap-3 text-sm text-brand-700"><span class="mt-1 h-2 w-2 rounded-full bg-brand-500"></span><span>${item}</span></li>`
          )
          .join('');

        elements.aboutTitle.textContent = copy.about.title;
        elements.aboutText.textContent = copy.about.text;

        elements.servicesTitle.textContent = copy.services.title;
        elements.servicesText.textContent = copy.services.text;
        elements.servicesGrid.innerHTML = copy.services.cards
          .map(
            (service) =>
              `<article class="group rounded-2xl border border-brand-300/60 bg-white p-6 shadow-soft transition hover:-translate-y-1 hover:border-brand-500/60"><h3 class="text-lg font-semibold text-brand-900">${service.title}</h3><p class="mt-3 text-sm leading-relaxed text-brand-700">${service.description}</p></article>`
          )
          .join('');

        elements.contactTitle.textContent = copy.contact.title;
        elements.contactText.textContent = copy.contact.text;
        elements.contactLocationLabel.textContent = copy.contact.locationLabel;
        elements.contactLocation.textContent = copy.contact.location;
        elements.contactEmailLabel.textContent = copy.contact.emailLabel;
        elements.contactEmail.textContent = copy.contact.email;
        elements.contactEmail.href = `mailto:${copy.contact.email}`;
        elements.contactPhoneLabel.textContent = copy.contact.phoneLabel;
        elements.contactPhone.textContent = copy.contact.phone;
        elements.contactPhone.href = `tel:${copy.contact.phone.replace(/\s|\(|\)|-/g, '')}`;

        elements.formNameLabel.textContent = copy.contact.form.nameLabel;
        elements.formEmailLabel.textContent = copy.contact.form.emailLabel;
        elements.formMessageLabel.textContent = copy.contact.form.messageLabel;
        elements.formSubmit.textContent = copy.contact.form.submit;
        elements.formNotice.textContent = copy.contact.form.notice;

        elements.footerCopy.textContent = copy.footer.copy;
        elements.footerPrivacy.textContent = copy.footer.privacy;
        elements.footerTerms.textContent = copy.footer.terms;
      }

      function toggleLanguage() {
        currentLang = currentLang === 'nl' ? 'en' : 'nl';
        renderPage(currentLang);
      }

      const langToggleDesktop = document.getElementById('langToggleDesktop');
      const langToggleMobile = document.getElementById('langToggleMobile');
      const menuButton = document.getElementById('menuButton');
      const mobileMenu = document.getElementById('mobileMenu');

      langToggleDesktop.addEventListener('click', toggleLanguage);
      langToggleMobile.addEventListener('click', toggleLanguage);

      menuButton.addEventListener('click', () => {
        const isOpen = mobileMenu.classList.toggle('hidden');
        menuButton.setAttribute('aria-expanded', String(!isOpen));
      });

      document.getElementById('contactForm').addEventListener('submit', (event) => {
        event.preventDefault();
        alert(siteContent[currentLang].alerts.formSubmitted);
      });

      renderPage(currentLang);
    </script>
  </body>
</html>
